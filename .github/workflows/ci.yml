name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Fast compilation gate ──────────────────────────────────────────
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install GTK 3 development headers (rfd backend)
        run: sudo apt-get update -qq && sudo apt-get install -y libgtk-3-dev
      - run: cargo check --workspace --exclude nereids-python
      # Compile-check workspace examples so docs snippets cannot drift
      # out of sync with the live crate APIs (see `crates/nereids-fitting/
      # examples/quickstart.rs`, mirrored into `docs/guide/src/quickstart-rust.md`).
      - run: cargo check --workspace --exclude nereids-python --examples

  # ── Formatting ─────────────────────────────────────────────────────
  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  # ── Clippy ─────────────────────────────────────────────────────────
  clippy:
    name: Clippy
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install GTK 3 development headers (rfd backend)
        run: sudo apt-get update -qq && sudo apt-get install -y libgtk-3-dev
      - run: cargo clippy --workspace --exclude nereids-python --all-targets -- -D warnings

  # ── Tests (cross-platform) ─────────────────────────────────────────
  test:
    name: Test (${{ matrix.os }})
    needs: check
    runs-on: ${{ matrix.os }}
    # Windows HDF5 static build may fail; don't block CI on it.
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install GTK 3 development headers (rfd backend, Linux only)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y libgtk-3-dev
      - name: Build
        run: cargo build --workspace --exclude nereids-python
      - name: Run tests
        run: cargo test --workspace --exclude nereids-python

  # ── Documentation (warnings = errors) ──────────────────────────────
  doc:
    name: Documentation
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install GTK 3 development headers (rfd backend)
        run: sudo apt-get update -qq && sudo apt-get install -y libgtk-3-dev
      - name: Build docs
        run: cargo doc --workspace --no-deps --exclude nereids-python
        env:
          RUSTDOCFLAGS: -D warnings

  # ── Python bindings ────────────────────────────────────────────────
  python:
    name: Python bindings
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install pixi
        uses: prefix-dev/setup-pixi@v0.9.4
        with:
          run-install: true
      # Drift gate: catches public symbols added to bindings/python/python/
      # nereids/__init__.pyi without a corresponding update to
      # docs/guide/src/python-api.md or the allowlist (issue #533). Runs
      # on every PR — the same step in docs.yml only runs post-merge.
      - name: Check curated Python API page is in sync with .pyi stubs
        run: pixi run lint-docs
      - name: Build and test Python bindings
        run: pixi run test-python

  # ── Code coverage ──────────────────────────────────────────────────
  coverage:
    name: Coverage
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Install GTK 3 development headers (rfd backend)
        run: sudo apt-get update -qq && sudo apt-get install -y libgtk-3-dev
      - name: Generate coverage
        run: cargo llvm-cov --workspace --exclude nereids-python --lcov --output-path lcov.info
      - name: Upload to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
