name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  # ── Fast compilation gate ──────────────────────────────────────────
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: "1.96.1" # keep in sync with rust-toolchain.toml
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      - run: cargo check --workspace --exclude nereids-python
      # Compile-check workspace examples so docs snippets cannot drift
      # out of sync with the live crate APIs (see `crates/nereids-fitting/
      # examples/quickstart.rs`, mirrored into `docs/guide/src/quickstart-rust.md`).
      - run: cargo check --workspace --exclude nereids-python --examples
      # Tripwire: the Linux GUI graph must stay GTK-free — a GTK link
      # forces the PyPI wheel off manylinux_2_28 (ORNL RHEL 8 ceiling)
      # and into vendoring an entire GTK stack (the 0.2.0/0.2.1
      # regression). See scripts/check_wheel_policy.sh.
      # Capture the graph first: the default shell has no pipefail, so
      # a cargo tree failure inside a pipeline would read as "no GTK"
      # and silently disarm the tripwire; a plain assignment under -e
      # aborts the step instead.
      - name: Assert no GTK in the Linux GUI dependency graph
        run: |
          graph=$(cargo tree -p nereids-gui --target x86_64-unknown-linux-gnu -e normal,build)
          if echo "$graph" | grep -iE 'gtk|glib-sys|gobject-sys|gdk-sys|atk-sys|cairo-sys|pango-sys'; then
            echo "::error::GTK-family crate found in the Linux nereids-gui graph"
            exit 1
          fi

  # ── Formatting ─────────────────────────────────────────────────────
  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: "1.96.1" # keep in sync with rust-toolchain.toml
          components: rustfmt
      - run: cargo fmt --all -- --check

  # ── Clippy ─────────────────────────────────────────────────────────
  # Two OSes because the GUI dialog stack is target-gated: ubuntu lints
  # the Linux tiers (rfd portal + egui-file-dialog), macos lints the
  # native-blocking arm.
  clippy:
    name: Clippy (${{ matrix.os }})
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: "1.96.1" # keep in sync with rust-toolchain.toml
          components: clippy
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      - run: cargo clippy --workspace --exclude nereids-python --all-targets -- -D warnings

  # ── Tests (cross-platform) ─────────────────────────────────────────
  # Tests marked #[ignore] (the slow statistical and calibration-recovery
  # checks) and coverage run nightly on main instead (nightly.yml).
  test:
    name: Test (${{ matrix.os }})
    needs: check
    runs-on: ${{ matrix.os }}
    # Windows HDF5 static build may fail; don't block CI on it.
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: "1.96.1" # keep in sync with rust-toolchain.toml
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      - name: Build
        run: cargo build --workspace --exclude nereids-python
      - name: Run tests
        run: cargo test --workspace --exclude nereids-python

  # ── Documentation (warnings = errors) ──────────────────────────────
  doc:
    name: Documentation
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: "1.96.1" # keep in sync with rust-toolchain.toml
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      - name: Build docs
        run: cargo doc --workspace --no-deps --exclude nereids-python
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Public surface comes with a map change
        if: github.event_name == 'pull_request'
        run: python3 scripts/check_public_surface.py HEAD^1
        env:
          RUSTDOCFLAGS: -D warnings

  # ── Docs drift gate (lightweight; runs in parallel with check) ─────
  # Stdlib-only script, so it runs WITHOUT pixi/rust/maturin to fail
  # fast when a PyO3 stub symbol is added without a corresponding
  # update to docs/guide/src/python-api.md or the allowlist (#533).
  docs-drift:
    name: Docs drift gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"
      - run: python scripts/check_python_api_drift.py

  # ── Python bindings ────────────────────────────────────────────────
  python:
    name: Python bindings
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: "1.96.1" # keep in sync with rust-toolchain.toml
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      - name: Install pixi
        uses: prefix-dev/setup-pixi@9dabb60412d3d2d967a8d682f7ce01317af40514 # v0.11.0
        with:
          run-install: true
      - name: Build and test Python bindings
        run: pixi run test-python
      # MCP tests need fastmcp, which conflicts with conda's importlib-metadata
      # in the default env, so they run in the isolated `mcp` environment.
      # Without this, tests/test_mcp.py silently import-skips (fastmcp absent).
      # Like the test-python step above, some MCP tests fetch live evaluations
      # from the IAEA service on a cold cache (deliberate: they assert against
      # real pinned-library tapes, e.g. W-182 rejection). A service outage
      # surfaces as explicit skips (_load_endf_or_skip), not a gate failure.
      - name: Build and test MCP server (isolated fastmcp env)
        run: pixi run -e mcp test-mcp
