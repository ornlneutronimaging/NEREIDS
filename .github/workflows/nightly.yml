name: Nightly

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  # The shards balance the measured run times of the tests. "rest" skips the
  # tests that the other shards select and runs all other ignored tests.
  slow-tests:
    name: Slow tests (${{ matrix.os }}, ${{ matrix.shard }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        shard: ["1", "2", "3", "4", rest]
        include:
          - shard: "1"
            filter: >-
              pulse_calibration::two_foils_on_the_same_pulse_agree_as_chi_squared_says
          - shard: "2"
            filter: >-
              pulse_calibration::experiments_calibrated_with_a_moderation_rate_at_its_bound_keep_density_and_temperature
          - shard: "3"
            filter: >-
              pulse_calibration::calibrated_experiments_have_error_bars_that_are_their_scatter
              maps::
          - shard: "4"
            filter: >-
              s3_a_lattice_foil_calibrates_on_sammy_crystal_lattice_counts
          - shard: rest
            filter: >-
              --skip pulse_calibration::two_foils_on_the_same_pulse_agree_as_chi_squared_says
              --skip pulse_calibration::experiments_calibrated_with_a_moderation_rate_at_its_bound_keep_density_and_temperature
              --skip pulse_calibration::calibrated_experiments_have_error_bars_that_are_their_scatter
              --skip maps::
              --skip s3_a_lattice_foil_calibrates_on_sammy_crystal_lattice_counts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.96.1" # keep in sync with rust-toolchain.toml
      # Restores the per-OS test cache that ci.yml saves on main. A copy saved
      # here would lack what `cargo build` adds to it.
      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2
        with:
          shared-key: test
          save-if: false
      # One test at a time: each test gets the whole rayon pool, and the log
      # gives the run time of each test.
      - run: cargo test --workspace --exclude nereids-python --no-fail-fast -- --ignored --test-threads=1 ${{ matrix.filter }}

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.96.1" # keep in sync with rust-toolchain.toml
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Pin release-tag SHAs only (like security.yml), never taiki-e's
      # per-tool tags (e.g. `cargo-llvm-cov`): those are orphan commits on
      # no branch, and Dependabot's github_actions updater hard-errors on
      # them ("no such commit"), killing the whole update run.
      - uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2 # v2.90.0
        with:
          tool: cargo-llvm-cov
      - name: Generate coverage
        run: cargo llvm-cov --workspace --exclude nereids-python --lcov --output-path lcov.info
      - name: Upload to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: lcov.info
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
