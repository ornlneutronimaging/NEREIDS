name: Nightly

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  slow-tests:
    name: Slow tests (${{ matrix.os }}, ${{ matrix.shard }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        shard: [pulse-a, pulse-b, maps, rest]
        include:
          - shard: pulse-a
            filter: "pulse_calibration::a pulse_calibration::two_foils"
          - shard: pulse-b
            filter: "pulse_calibration::calibrated pulse_calibration::experiments pulse_calibration::the"
          - shard: maps
            filter: "maps::"
          - shard: rest
            filter: >-
              --skip pulse_calibration::a --skip pulse_calibration::two_foils
              --skip pulse_calibration::calibrated --skip pulse_calibration::experiments
              --skip pulse_calibration::the --skip maps::
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.96.1" # keep in sync with rust-toolchain.toml
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      - run: cargo test --workspace --exclude nereids-python -- --ignored ${{ matrix.filter }}

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.96.1" # keep in sync with rust-toolchain.toml
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      # Pin release-tag SHAs only (like security.yml), never taiki-e's
      # per-tool tags (e.g. `cargo-llvm-cov`): those are orphan commits on
      # no branch, and Dependabot's github_actions updater hard-errors on
      # them ("no such commit"), killing the whole update run.
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-llvm-cov
      - name: Generate coverage
        run: cargo llvm-cov --workspace --exclude nereids-python --lcov --output-path lcov.info
      - name: Upload to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: lcov.info
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
