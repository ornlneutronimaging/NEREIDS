name: Documentation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build docs
    runs-on: ubuntu-latest
    # Build provenance (one rust toolchain, not two):
    #   dtolnay/rust-toolchain  -> rustc + cargo on PATH (used by both
    #                              `cargo doc` in doc-api AND `maturin
    #                              develop` in build). Pixi does NOT
    #                              own rust; the host rustup install is
    #                              the single source of truth.
    #   Swatinem/rust-cache     -> caches target/ for cargo doc + maturin
    #   setup-pixi              -> Python + mdbook + pdoc + maturin
    #                              (orchestrator deps; no rust here —
    #                              maturin is the build front-end that
    #                              wraps cargo + the rust toolchain
    #                              installed above)
    #   pixi run doc-build      -> doc-guide (mdbook) + doc-api (cargo
    #                              doc) + doc-python (pdoc on installed
    #                              wheel)
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install GTK 3 development headers (rfd backend)
        run: sudo apt-get update -qq && sudo apt-get install -y libgtk-3-dev

      - name: Install pixi
        uses: prefix-dev/setup-pixi@v0.9.4
        with:
          run-install: true

      # Drive the entire docs build through the `doc-build` pixi task. It
      # orchestrates `doc-guide` (mdBook), `doc-api` (cargo doc), and
      # `doc-python` (pdoc on the maturin-installed wheel), then `cp -r
      # target/doc target/book/api` runs LAST as the task's cmd. Running
      # the steps manually here would re-trigger mdBook via doc-python's
      # depends-on after we'd already copied rustdoc into target/book/api,
      # wiping the rustdoc artifact (mdBook clears its destination dir
      # on every build).
      - name: Build complete docs site
        run: pixi run doc-build
        env:
          RUSTDOCFLAGS: -D warnings

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: target/book

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
