name: Documentation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install mdBook
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSL https://github.com/rust-lang/mdBook/releases/download/v0.4.43/mdbook-v0.4.43-x86_64-unknown-linux-gnu.tar.gz | tar xz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install pixi
        uses: prefix-dev/setup-pixi@v0.9.4
        with:
          run-install: true

      # Drive the entire docs build through the `doc-build` pixi task. It
      # orchestrates `doc-guide` (mdBook), `doc-api` (cargo doc), and
      # `doc-python` (pdoc on the maturin-installed wheel), then `cp -r
      # target/doc target/book/api` runs LAST as the task's cmd. Running
      # the steps manually here would re-trigger mdBook via doc-python's
      # depends-on after we'd already copied rustdoc into target/book/api,
      # wiping the rustdoc artifact (mdBook clears its destination dir
      # on every build).
      - name: Build complete docs site
        run: pixi run doc-build
        env:
          RUSTDOCFLAGS: -D warnings

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: target/book

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
