name: Documentation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build docs
    runs-on: ubuntu-latest
    # Build provenance (one rust toolchain, not two):
    #   dtolnay/rust-toolchain  -> rustc + cargo on PATH (used by both
    #                              `cargo doc` in doc-api AND `maturin
    #                              develop` in build). Pixi does NOT
    #                              own rust; the host rustup install is
    #                              the single source of truth.
    #   Swatinem/rust-cache     -> caches target/ for cargo doc + maturin
    #   setup-pixi              -> Python + mdbook + pdoc + maturin
    #                              (orchestrator deps; no rust here —
    #                              maturin is the build front-end that
    #                              wraps cargo + the rust toolchain
    #                              installed above)
    #   pixi run doc-build      -> doc-guide (mdbook) + doc-api (cargo
    #                              doc) + doc-python (pdoc on installed
    #                              wheel)
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # Fail fast on drift between the PyO3 type stubs and the curated
      # python-api.md page (issue #533).  The script is stdlib-only;
      # running it BEFORE the (slow) rust + mdbook + pixi setup avoids
      # paying ~1 min of environment-install cost when the drift gate
      # fails.
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.10"
      - name: Check curated Python API page is in sync with .pyi stubs
        run: python scripts/check_python_api_drift.py

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Install pixi
        uses: prefix-dev/setup-pixi@a0af7a228712d6121d37aba47adf55c1332c9c2e # v0.9.4
        with:
          run-install: true

      # Drive the entire docs build through the `doc-build` pixi task. It
      # orchestrates `doc-guide` (mdBook), `doc-api` (cargo doc), and
      # `doc-python` (pdoc on the maturin-installed wheel), then `cp -r
      # target/doc target/book/api` runs LAST as the task's cmd. Running
      # the steps manually here would re-trigger mdBook via doc-python's
      # depends-on after we'd already copied rustdoc into target/book/api,
      # wiping the rustdoc artifact (mdBook clears its destination dir
      # on every build).
      - name: Build complete docs site
        run: pixi run doc-build
        env:
          RUSTDOCFLAGS: -D warnings

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: target/book

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
