[package]
name = "nereids-physics"
description = "Cross-section calculation, broadening, and transmission forward model"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["cross-section", "neutron", "resonance", "physics", "sammy"]
categories = ["science"]

[features]
default = []
# Exposes internal test-only constructors (e.g. `resolution::test_support`)
# across crate boundaries.  Downstream crates enable this in their
# dev-dependencies to construct synthetic `ResolutionPlan` /
# `SparseEmpiricalCubaturePlan` instances for CI-hermetic tests.  Not
# intended for production builds; never enabled by default.
test-support = []

[dependencies]
nereids-core = { workspace = true }
nereids-endf = { workspace = true }
num-complex = { workspace = true }
rayon = { workspace = true }
microlp = { workspace = true }

[dev-dependencies]
# Integration tests under `tests/` are compiled as a separate crate
# that links against the production build of `nereids-physics`, so
# they cannot see items gated only by `#[cfg(test)]`.  Enabling the
# `test-support` feature here exposes `resolution::test_support` to
# the integration suite without leaking it into release builds.
#
# MUST be path-only (no version): a versioned self-dep (e.g.
# `workspace = true`, which pins the current 0.x.y) cannot be
# published, because `cargo publish` then tries to resolve that exact
# version from crates.io before it exists ("failed to select a version
# for nereids-physics = ^X").  Version-less dev-deps are dropped from
# the published manifest, so this is safe and publishable.
nereids-physics = { path = ".", features = ["test-support"] }
# Exposes `nereids_endf::resonance::test_support` — synthetic
# `ResonanceData` builders shared with sibling crates' tests.
nereids-endf = { workspace = true, features = ["test-support"] }

