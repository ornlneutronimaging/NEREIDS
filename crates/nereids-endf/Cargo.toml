[package]
name = "nereids-endf"
description = "ENDF file retrieval, caching, and resonance parameter parsing"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["endf", "nuclear", "resonance", "neutron", "parsing"]
categories = ["science"]

[features]
default = []
# Exposes `resonance::test_support` — a feature-gated module of synthetic
# `ResonanceData` / `ResonanceRange` builders used by downstream crates'
# tests to construct hand-designed fixtures (single-resonance U-238,
# Hf-178/Hf-177 multi-resonance, generic parameterized helpers, etc.).
# Downstream crates enable this feature in their `[dev-dependencies]`
# block.  Never enabled in release builds; production code never sees
# these helpers.
test-support = []

[dependencies]
endf-mat = { workspace = true }
nereids-core = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
reqwest = { workspace = true }
zip = { workspace = true }
dirs = { workspace = true }

[dev-dependencies]
tempfile = "3"
# Self dev-dep enables in-crate `#[cfg(test)]` blocks and integration
# tests under `crates/nereids-endf/tests/` (a separate crate boundary)
# to consume `resonance::test_support`.  MUST be path-only (no version):
# a versioned self-dep (e.g. `workspace = true`, which pins the current
# 0.x.y) cannot be published, because `cargo publish` then tries to
# resolve that exact version from crates.io before it exists ("failed to
# select a version for nereids-endf = ^X").  Version-less dev-deps are
# dropped from the published manifest, so this is safe and publishable.
nereids-endf = { path = ".", features = ["test-support"] }
