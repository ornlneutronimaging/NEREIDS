# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
inheritance: true
reviews:
  auto_review:
    enabled: true
    auto_incremental_review: false
    # Dependency bumps do not use the hourly review allowance.
    ignore_usernames:
      - "dependabot[bot]"
  pre_merge_checks:
    docstrings:
      mode: "off"
  finishing_touches:
    docstrings:
      enabled: false
    unit_tests:
      enabled: false
    autofix:
      enabled: false
