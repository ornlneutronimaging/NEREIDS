[workspace]
resolver = "2"
members = [
    "crates/endf-mat",
    "crates/nereids-core",
    "crates/nereids-endf",
    "crates/nereids-physics",
    "crates/nereids-io",
    "crates/nereids-fitting",
    "crates/nereids-pipeline",
    "bindings/python",
    "apps/gui",
]

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/ornlneutronimaging/NEREIDS"

[workspace.dependencies]
# Internal crates (version required for crates.io; path used locally)
endf-mat = { version = "0.3.0", path = "crates/endf-mat" }
nereids-core = { version = "0.3.0", path = "crates/nereids-core" }
nereids-endf = { version = "0.3.0", path = "crates/nereids-endf" }
nereids-physics = { version = "0.3.0", path = "crates/nereids-physics" }
nereids-io = { version = "0.3.0", path = "crates/nereids-io" }
nereids-fitting = { version = "0.3.0", path = "crates/nereids-fitting" }
nereids-pipeline = { version = "0.3.0", path = "crates/nereids-pipeline" }

# Common external dependencies
thiserror = "2"
ndarray = "0.17"
faer = { version = "0.24", default-features = false, features = ["std", "linalg"] }
libm = "0.2"
num-complex = "0.4"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls-native-roots"] }
zip = "2"
dirs = "7"
tiff = "0.11"
image = "0.25"
pyo3 = { version = "0.29", features = ["extension-module"] }
numpy = "0.29"
# glow renderer, no wgpu (its D3D12 backend fails to build on Windows); do not
# re-enable wgpu. libwayland must stay dlopen'ed: restore it with the direct
# Linux-only winit dep in apps/gui/Cargo.toml; do not drop that dep.
eframe = { version = "0.34", default-features = false, features = ["accesskit", "default_fonts", "glow", "persistence", "wayland", "x11"] }
egui = "0.34"
egui_extras = { version = "0.34", features = ["image", "svg"] }
egui_plot = "0.35"
# Portal backend only; do not re-enable "gtk3". EXACT-VERSION PIN: the GUI's
# dialog-failure classification matches rfd 0.17.2's log wording; any bump must
# re-verify FileDialogs::apply_native_outcome and logging.rs.
rfd = { version = "=0.17.2", default-features = false }
# Pure-egui fallback dialog; LOCKSTEP with egui minors — bump together.
egui-file-dialog = "0.13"
hdf5 = { package = "hdf5-metno", version = "0.12", features = ["static", "zlib"] }
rand = "0.10"
rand_chacha = "0.10"
rand_distr = "0.6"
microlp = "0.6"
tracing = "0.1"
log = "0.4"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "registry", "ansi"] }
opener = { version = "0.9", features = ["reveal"] }
time = { version = "0.3", default-features = false, features = ["formatting", "macros"] }
tempfile = "3"

# Optimize test/dev builds: the resonance kernels dominate the test battery.
[profile.dev]
opt-level = 2

[profile.test]
opt-level = 2
